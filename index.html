<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Office Radio | Synced Deep Work</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        glass: {
                            100: 'rgba(255, 255, 255, 0.1)',
                            200: 'rgba(255, 255, 255, 0.2)',
                            300: 'rgba(255, 255, 255, 0.3)',
                        }
                    }
                }
            }
        }
    </script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-gray-900 text-white min-h-screen flex items-center justify-center overflow-hidden font-sans relative">
    
    <!-- Animated Office Background -->
    <div class="absolute inset-0 z-0 bg-[#0a0f1a] overflow-hidden flex items-center justify-center">
        <!-- The background image slightly scaled up so we can add a slow pan animation if needed -->
        <img id="bg-image" src="assets/bg.jpg" class="w-full h-full object-cover opacity-90 transition-all duration-1000 scale-[1.02]" alt="Office Background">
        <div class="absolute inset-0 bg-black/40 backdrop-brightness-75 mix-blend-overlay"></div>
        <div class="absolute inset-0 bg-gradient-to-t from-[#0a0f1a] via-transparent to-transparent"></div>
        
        <!-- Animated Particles / Dust motes -->
        <div id="particles" class="absolute inset-0 pointer-events-none"></div>
    </div>

    <!-- Hidden YouTube Player -->
    <div style="position:fixed;bottom:0;right:0;width:200px;height:200px;opacity:0.001;pointer-events:none;z-index:-10;overflow:hidden;">
        <div id="youtubeBridge"></div>
    </div>

    <!-- Main UI Container (Glassmorphism) -->
    <main class="relative z-10 w-full max-w-md mx-4 p-6 sm:p-8 rounded-[2rem] glass-panel flex flex-col gap-6 transition-all duration-500">
        
        <!-- Header / Status -->
        <header class="flex items-center justify-between">
            <h1 class="text-xl font-bold tracking-tight text-white/90">Office Radio</h1>
            <div class="flex items-center gap-2 px-3 py-1.5 rounded-full bg-glass-100 border border-glass-200 text-xs font-medium text-emerald-400">
                <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse shadow-[0_0_8px_rgba(52,211,153,0.8)]"></span>
                <span id="room-status">Room: Synced</span>
            </div>
        </header>

        <!-- Pomodoro Timer -->
        <section class="flex flex-col items-center justify-center py-4">
            <div id="timer-display" class="text-6xl font-bold tracking-tighter text-white drop-shadow-md font-mono">25:00</div>
            <div id="timer-label" class="text-sm font-medium text-white/60 uppercase tracking-widest mt-1">Deep Work</div>
            
            <div class="flex items-center gap-4 mt-4">
                <button id="btn-timer-toggle" class="px-6 py-2 rounded-full bg-white text-gray-900 font-semibold text-sm hover:bg-gray-100 transition-colors shadow-lg active:scale-95">Start Focus</button>
                <button id="btn-timer-reset" class="px-4 py-2 rounded-full bg-glass-100 border border-glass-200 text-white/80 hover:text-white hover:bg-glass-200 text-sm font-medium transition-colors active:scale-95">Reset</button>
            </div>
        </section>

        <hr class="border-glass-200">

        <!-- Music Player -->
        <section class="flex flex-col gap-4">
            <div class="flex items-center gap-4">
                <div class="w-14 h-14 rounded-full bg-gray-800 border-2 border-glass-300 flex-shrink-0 overflow-hidden shadow-lg relative group">
                    <div id="cover-art" class="w-full h-full bg-cover bg-center transition-transform duration-500" style="background-image: url('https://images.unsplash.com/photo-1614680376593-902f74a8140e?q=80&w=2574&auto=format&fit=crop');"></div>
                    <div class="absolute inset-0 bg-black/40 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity">
                        <span class="text-xs font-medium">🎵</span>
                    </div>
                </div>
                
                <div class="flex-1 min-w-0">
                    <h2 class="text-sm font-bold text-white truncate drop-shadow-sm flex items-center">
                        <span id="track-name">Loading Track...</span>
                        <span class="cursor-blink"></span>
                    </h2>
                    <p id="playlist-name" class="text-xs text-white/60 truncate mt-0.5">Focus Beats</p>
                    
                    <!-- Progress Bar -->
                    <div class="flex items-center gap-2 mt-2">
                        <span id="time-now" class="text-[10px] text-white/50 font-mono">0:00</span>
                        <div class="flex-1 h-1.5 bg-glass-100 rounded-full overflow-hidden cursor-pointer" id="progress-container">
                            <div id="progress-fill" class="h-full bg-emerald-400 w-0 transition-all duration-300 rounded-full pointer-events-none"></div>
                        </div>
                        <span id="time-total" class="text-[10px] text-white/50 font-mono">0:00</span>
                    </div>
                </div>
            </div>

            <!-- Player Controls -->
            <div class="flex items-center justify-center gap-6 mt-2">
                <button id="btn-prev" class="text-white/70 hover:text-white transition-colors active:scale-90" aria-label="Previous">
                    <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24"><path d="M7 6c.55 0 1 .45 1 1v10c0 .55-.45 1-1 1s-1-.45-1-1V7c0-.55.45-1 1-1zm3.66 6.82l5.77 4.07c.66.47 1.58-.01 1.58-.82V7.93c0-.81-.91-1.28-1.58-.82l-5.77 4.07c-.57.4-.57 1.24 0 1.64z"/></svg>
                </button>
                <button id="btn-play" class="w-12 h-12 flex items-center justify-center rounded-full bg-white text-gray-900 shadow-[0_0_20px_rgba(255,255,255,0.3)] hover:scale-105 active:scale-95 transition-all" aria-label="Play/Pause">
                    <svg id="icon-play" class="w-6 h-6 ml-1" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                </button>
                <button id="btn-next" class="text-white/70 hover:text-white transition-colors active:scale-90" aria-label="Next">
                    <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24"><path d="M7.58 16.89l5.77-4.07c.56-.4.56-1.24 0-1.63L7.58 7.11C6.91 6.65 6 7.12 6 7.93v8.14c0 .81.91 1.28 1.58.82zM16 7v10c0 .55.45 1 1 1s1-.45 1-1V7c0-.55-.45-1-1-1s-1 .45-1 1z"/></svg>
                </button>
            </div>
            
            <!-- Veto Voting -->
            <div class="flex items-center justify-between mt-2 pt-3 border-t border-glass-100">
                <span class="text-xs text-white/50">Veto Skip</span>
                <button id="btn-veto" class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-glass-100 hover:bg-glass-200 border border-glass-200 text-xs font-medium text-white/80 hover:text-white transition-colors active:scale-95">
                    <span>Vote to Skip</span>
                    <span id="veto-count" class="bg-black/30 px-1.5 py-0.5 rounded text-[10px]">0/2</span>
                </button>
            </div>
        </section>

        <!-- Removed Vibe Shifts as requested -->
        
    </main>

    <!-- YouTube IFrame API -->
    <script src="https://www.youtube.com/iframe_api"></script>
    <script src="app.js"></script>
</body>
</html>
